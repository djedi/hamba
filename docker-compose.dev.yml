# Docker Compose for local development
# Usage: make up (picks free host ports, see Makefile)
#
# This is a standalone dev configuration - does NOT require docker-compose.yml

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
    ports:
      - "${BACKEND_PORT:-8877}:8877"
    volumes:
      # Mount source code; `make restart` rebuilds with `cargo run`
      - ./backend/src:/app/src:ro
      # Cache build artifacts between restarts
      - backend-target:/app/target
      # Persist database in development
      - ./data:/app/data
    env_file:
      - .env
    environment:
      - DATABASE_PATH=/app/data/hamba.db
      - LOG_LEVEL=debug
      - FRONTEND_URL=http://localhost:${FRONTEND_PORT:-8878}
    command: ["cargo", "run"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8877/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    ports:
      - "${FRONTEND_PORT:-8878}:8878"
    volumes:
      # Mount only source directories for hot reload (NOT .svelte-kit)
      - ./frontend/src:/app/src
      - ./frontend/static:/app/static
      - ./frontend/svelte.config.js:/app/svelte.config.js
      - ./frontend/vite.config.ts:/app/vite.config.ts
      - ./frontend/tsconfig.json:/app/tsconfig.json
    environment:
      - NODE_ENV=development
      # The browser talks to the backend through its published host port
      - VITE_API_URL=http://localhost:${BACKEND_PORT:-8877}
      - VITE_WS_URL=ws://localhost:${BACKEND_PORT:-8877}/ws
    depends_on:
      - backend
    # Regenerate .svelte-kit inside container before starting dev server
    command: ["sh", "-c", "bunx svelte-kit sync && bun run dev --host 0.0.0.0 --port 8878"]

volumes:
  backend-target:
